workflows:

  # ─────────────────────────────────────────────────────────────────────────
  # 1.  DEBUG  – fast build, auto-signed with the Android debug key
  #     Trigger: every push to any branch
  # ─────────────────────────────────────────────────────────────────────────
  android-debug:
    name: S3 Hacks – Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      vars:
        NDK_VERSION: "25.2.9519653"   # r25c – supports Apple Silicon (arm64) host

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:
      - name: Install exact NDK version
        script: |
          set -e
          # sdkmanager is not in $PATH on Codemagic — locate it under cmdline-tools
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" --channel=0 > /dev/null
          echo "NDK $NDK_VERSION installed at $ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

      - name: Ensure gradle-wrapper.jar is present
        script: |
          set -e
          JAR="gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR" ] || [ ! -s "$JAR" ]; then
            echo "gradle-wrapper.jar missing — downloading from Gradle distribution …"
            VER="7.6.3"
            curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" \
              -o /tmp/gradle-${VER}-bin.zip
            unzip -p /tmp/gradle-${VER}-bin.zip \
              "gradle-${VER}/lib/plugins/gradle-wrapper-${VER}.jar" \
              > "$JAR"
            echo "Downloaded $(wc -c < $JAR) bytes → $JAR"
          else
            echo "gradle-wrapper.jar OK ($(wc -c < $JAR) bytes)"
          fi

      - name: Make Gradle wrapper executable
        script: chmod +x gradlew

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/**/*.apk
      - app/build/outputs/logs/**

    publishing:
      email:
        recipients:
          - fghghif14@gmail.com      # ← only place to edit: your real email
        notify:
          success: true
          failure: true


  # ─────────────────────────────────────────────────────────────────────────
  # 2.  RELEASE  – keystore is GENERATED by this script on every build,
  #     then used immediately to sign the APK.
  #
  #     The generated .keystore file is exported as an artifact alongside
  #     the APK so you can keep it if you ever need to re-sign consistently.
  #
  #     Nothing needs to be configured in the Codemagic dashboard.
  #     Trigger: every tag push matching v* (e.g. git tag v1.0 && git push --tags)
  # ─────────────────────────────────────────────────────────────────────────
  android-release:
    name: S3 Hacks – Release APK (auto-signed)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      vars:
        NDK_VERSION:        "22.0.7026061"
        KEYSTORE_PATH:      "s3hacks-release.keystore"
        KEY_ALIAS:          "s3hacks"
        KEY_PASSWORD:       "S3HacksKey2024!"
        STORE_PASSWORD:     "S3HacksStore2024!"
        KEY_DNAME:          "CN=S3 Hacks, OU=Development, O=S3 Hacks, L=Unknown, ST=Unknown, C=US"
        KEY_VALIDITY_DAYS:  "10000"

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Install exact NDK version
        script: |
          set -e
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" --channel=0 > /dev/null
          echo "NDK $NDK_VERSION installed at $ANDROID_SDK_ROOT/ndk/$NDK_VERSION"

      - name: Generate release keystore
        script: |
          set -e
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          keytool \
            -genkeypair \
            -v \
            -storetype JKS \
            -keystore  "$KEYSTORE_PATH" \
            -alias     "$KEY_ALIAS" \
            -keyalg    RSA \
            -keysize   2048 \
            -validity  "$KEY_VALIDITY_DAYS" \
            -storepass "$STORE_PASSWORD" \
            -keypass   "$KEY_PASSWORD" \
            -dname     "$KEY_DNAME"
          echo "Keystore generated at $KEYSTORE_PATH"
          keytool -list -v \
            -keystore  "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias     "$KEY_ALIAS" \
            | grep -E "Alias|Valid|SHA"

      - name: Ensure gradle-wrapper.jar is present
        script: |
          set -e
          JAR="gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR" ] || [ ! -s "$JAR" ]; then
            echo "gradle-wrapper.jar missing — downloading from Gradle distribution …"
            VER="7.6.3"
            curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" \
              -o /tmp/gradle-${VER}-bin.zip
            unzip -p /tmp/gradle-${VER}-bin.zip \
              "gradle-${VER}/lib/plugins/gradle-wrapper-${VER}.jar" \
              > "$JAR"
            echo "Downloaded $(wc -c < $JAR) bytes → $JAR"
          else
            echo "gradle-wrapper.jar OK ($(wc -c < $JAR) bytes)"
          fi

      - name: Make Gradle wrapper executable
        script: chmod +x gradlew

      - name: Build and sign release APK
        script: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signature
        script: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Verifying: $APK"
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)/apksigner \
            verify --verbose "$APK" 2>&1 | head -20

      - name: Copy keystore next to APK for export
        script: |
          cp "$KEYSTORE_PATH" app/build/outputs/apk/release/s3hacks-release.keystore
          echo "Keystore copied — download it from Artifacts to keep a consistent key for future builds"

    artifacts:
      - app/build/outputs/apk/release/**/*.apk
      - app/build/outputs/apk/release/s3hacks-release.keystore
      - app/build/outputs/logs/**

    publishing:
      email:
        recipients:
          - fghghif14@gmail.com     # ← only place to edit: your real email
        notify:
          success: true
          failure: true
