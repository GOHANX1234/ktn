apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 33

    defaultConfig {
        applicationId "uk.lgl"
        minSdk 21          // Compose minimum; was 19
        targetSdk 33
        versionCode 1
        versionName "2.9"
        multiDexEnabled false
        ndk {
            abiFilters 'arm64-v8a'
        }
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        // Must match Kotlin 1.8.22
        kotlinCompilerExtensionVersion '1.4.8'
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    ndkVersion = '25.2.9519653'   // r25c â€“ first NDK with stable Apple Silicon (arm64 host) support
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Compose BOM â€” pins all Compose library versions consistently
    def composeBom = platform('androidx.compose:compose-bom:2023.06.01')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime'

    // Lifecycle + SavedState (needed for Compose in overlay/service context)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.savedstate:savedstate:1.2.1'

    // Coroutines (for LaunchedEffect delay)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
}
